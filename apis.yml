aid: st-labs
name: ST Labs
description: 'ST Labs (Standard Template Labs, stlabs.com) is an AI-native IT service
  management platform that turns historical ticket data, knowledge bases, and enterprise
  integrations into instant resolutions, automated workflows, and a living graph of
  the organization. Its capabilities span smart ticket enrichment (auto-classify,
  prioritize, attach resolution context), AI clustering into self-healing workflows,
  AI-agent self-service, and a "Digital Twin" / Axiom context graph that maps real-time
  relationships between people, applications, infrastructure, and processes and is
  queryable in natural language. The product connects to 100+ systems (ServiceNow,
  Okta, AWS, Datadog, Slack, Workday, and more) across ITSM, identity, cloud, security,
  and collaboration. As of mid-2026 the company is in early-access/waitlist stage with
  no public developer API, and is backed by CRV and ICONIQ Capital.'
